; ============================================================
;  pipOS — HWiNFO VSB Index Discovery
;  Run this skin on the actual GZ302EA to find every sensor
;  index HWiNFO is exporting, then copy the numbers into
;  @Resources\Variables.inc (the Idx* stubs).
;
;  Prereq: HWiNFO running, Settings > enable "HWiNFO Gadget"
;  reporting, and each wanted sensor checked "Report value in
;  Gadget". HWiNFO then writes indices under:
;    HKEY_CURRENT_USER\SOFTWARE\HWiNFO64\VSB
;  as Sensor<N> / Label<N> / Value<N> / ValueRaw<N>.
;
;  This skin shows indices 0..23. Raise MaxIdx if you export
;  more. Each row: N | Label<N> = Value<N>
; ============================================================

[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
Draggable=1
BackgroundMode=2
SolidColor=10,7,0,255

[Variables]
@IncludeVars=#@#Variables.inc
MaxIdx=23

[Metadata]
Name=pipOS Discover
Author=pipOS
Information=Lists HWiNFO VSB registry indices for sensor mapping.
Version=0.1

; ---------- styles ----------
[sTitle]
FontFace=#FontMain#
FontColor=#AmberBright#
FontSize=13
StringStyle=BOLD
AntiAlias=1
SolidColor=0,0,0,1
Padding=6,4,6,4

[sHead]
FontFace=#FontMain#
FontColor=#AmberDim#
FontSize=9
AntiAlias=1

[sRow]
FontFace=#FontMain#
FontColor=#AmberBright#
FontSize=11
AntiAlias=1
ClipString=1
W=560
H=15

[sIdx]
FontFace=#FontMain#
FontColor=#AmberMid#
FontSize=11
StringStyle=BOLD
AntiAlias=1

; ---------- header ----------
[MeterTitle]
Meter=String
MeterStyle=sTitle
X=10
Y=10
Text=pipOS ── HWiNFO VSB INDEX DISCOVERY

[MeterHint]
Meter=String
MeterStyle=sHead
X=12
Y=32
Text=Copy the matching index numbers into @Resources\Variables.inc (Idx* vars).#CRLF#If a row is blank, that index isn't exported. If nothing shows, HWiNFO Gadget reporting is off.
W=560
ClipString=2

[MeterColHead]
Meter=String
MeterStyle=sHead
X=12
Y=66
Text=IDX   LABEL = VALUE

; ============================================================
;  Rows 0..MaxIdx. Each row = three registry measures + a String.
;  Rainmeter has no loops, so these are enumerated (CLAUDE.md dead-end 8).
;  Pattern repeats; only the index number changes.
; ============================================================

; ---------- index 0 ----------
[mLabel0]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=Label0
Substitute="":"—"

[mValue0]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=Value0

[Row0Idx]
Meter=String
MeterStyle=sIdx
X=12
Y=84
Text=00

[Row0]
Meter=String
MeterStyle=sRow
X=40
Y=0r
Text=[mLabel0] = [mValue0]
DynamicVariables=1

