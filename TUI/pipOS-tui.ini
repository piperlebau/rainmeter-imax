; ============================================================
;  TUI\pipOS-tui.ini — TUI / CONSOLE variant
;  MONOLITHIC by necessity (§17.1a): a child skin cannot land
;  inside a character grid without its cell origin and size
;  matching exactly, and any drift breaks the grid.
;
;  Reference: pipOS-console-live.html
;  Grid: 132 cols x 40 rows. One String meter PER ROW with an
;  explicit fixed W — never rely on font metrics (§17.3).
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
Draggable=0
BackgroundMode=2
SolidColor=#Bg#,255
DynamicVariables=1

[Variables]
@IncludeVars=#@#Variables.inc
; theme tokens — swap this line to change scheme (§17.5)
@IncludeTheme=#@#Themes\hc-amber.inc

; ---- SHARED LOGIC (§17.6) — identical includes to the Pixel skin ----
@IncludeLogic1=#@#logic\sensors.inc
@IncludeLogic2=#@#logic\workspace.inc
@IncludeLogic3=#@#logic\toggles.inc
@IncludeLogic4=#@#logic\status.inc
@IncludeLogic5=#@#logic\power.inc

[Metadata]
Name=pipOS (TUI)
Author=pipOS
Information=Character-grid console variant. Shares all logic with the Pixel variant.
Version=0.1

; ============================================================
;  FULL-GRID BACKGROUND — the skin's footprint is the whole
;  132x40 grid from day one, so the desktop never bleeds through
;  rows that aren't built yet (rows land in Milestone D).
; ============================================================
[MeterGridBG]
Meter=Shape
Shape=Rectangle 0,0,(#TuiOriginX#*2 + #GridCols#*#CellW#),(#TuiOriginY#*2 + #GridRows#*#CellH#) | FillColor #Bg#,255 | StrokeWidth 0

; ============================================================
;  ROW STYLE — the §17.3 rule made concrete.
;  Every row meter has the SAME fixed W. Glyph substitution
;  from a fallback font then cannot widen a row.
; ============================================================
[sRow]
FontFace=#FontMain#
FontSize=#TuiFontSize#
AntiAlias=1
ClipString=1
W=(#GridCols# * #CellW#)
H=#CellH#
X=#TuiOriginX#

; ---- row 0: prompt header ----
[Row00]
Meter=String
MeterStyle=sRow
Y=#TuiOriginY#
FontColor=#Fg#
Text=pipOS ~/[mWorkspace]$ shell --local
DynamicVariables=1

; ---- row 14: status strip, severity-coloured (§6.1) ----
[Row14]
Meter=String
MeterStyle=sRow
Y=(#TuiOriginY# + 14 * #CellH#)
; inverse-video: severity fill + ink text (was Ok-on-Ok = invisible)
FontColor=#InkOnFill#
SolidColor=#Ok#
Text=#StatusMsg#
DynamicVariables=1
; TODO(D): bind SolidColor to #StatusSev# via !SetOption

; ---- row 15: log line (§6.1a) ----
[Row15]
Meter=String
MeterStyle=sRow
Y=(#TuiOriginY# + 15 * #CellH#)
FontColor=#Dim#
Text=#LogLast#
DynamicVariables=1

; TODO(D): rows 1-13 and 16-39 per §17.2 layout.
; Compose each row's 132 characters in Lua, or build them from
; measured substrings — but keep ONE meter per row with fixed W.
