; ============================================================
;  Editor.ini — CHILD SKIN (W18)
;  Same machinery as Notes.ini at a larger size (SPEC §10.1).
;  Body is a FIXED clip region EdBodyH=129 (never grows).
;  One String meter per logical line, ClipString=1, Y=2R stack.
;  NEVER ClipString=2 (CLAUDE.md #8 / dead-end 2).
;  Shown only on editor-mode workspaces; swaps with the launch
;  bay at IDENTICAL 230px height (constraint 3).
;
;  Positioning: moves itself into the Editor hole on refresh
;  (Editor*/DpiScale from Variables.inc); assumes the main Pixel
;  skin sits at screen 0,0. Load it only in WRITE mode (WS4).
; ============================================================
[Rainmeter]
Update=1000
AccurateText=1
Draggable=0
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!Move "((#EditorX#+1)*#DpiScale#)" "((#EditorY#+1)*#DpiScale#)"]

[Variables]
@IncludeVars=#@#Variables.inc
; same theme line as the main skins — keep all three in sync (§17.5)
@IncludeTheme=#@#Themes\hc-amber.inc

[sBody]
FontFace=#FontMain#
FontColor=#Fg#
FontSize=#FontSizeBody#
AntiAlias=1
ClipString=1
W=(#EditorW#-24)
H=#EdLineH#

[MeterPlaceholder]
Meter=String
MeterStyle=sBody
X=12
Y=10
Text=editor child skin — fixed #EdBodyH#px clip region
DynamicVariables=1
