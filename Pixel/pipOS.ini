; ============================================================
;  Pixel\pipOS.ini — MAIN SKIN (PIXEL / IMAX variant)
;  Holds the bezel, amber frame, and every "light" widget.
;  Notes (W17) and Editor (W18) panes are SEPARATE child
;  skins that land inside frames drawn here (CLAUDE.md #1).
;
;  This skeleton implements Milestone A0: bezel + frame +
;  header + the two reserved holes. The remaining light
;  widgets are @Included as sections from includes\ — those
;  files are stubs to be filled in during A1 (see build order).
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
Draggable=0
BackgroundMode=2
SolidColor=5,4,3,255
; DPI: design is 1280x800 logical. Decide the scaling strategy
; (SPEC §1.1 / §16 item 4) before hard-tuning positions.

[Variables]
@IncludeVars=#@#Variables.inc
; theme tokens — swap this line to change scheme (§17.5)
@IncludeTheme=#@#Themes\hc-amber.inc

; ---- SHARED LOGIC (§17.6) — measures only, also used by TUI ----
@IncludeLogic1=#@#logic\sensors.inc
@IncludeLogic2=#@#logic\workspace.inc
@IncludeLogic3=#@#logic\toggles.inc
@IncludeLogic4=#@#logic\status.inc
@IncludeLogic5=#@#logic\power.inc

[Metadata]
Name=pipOS
Author=pipOS
Information=Amber-phosphor IMAX-console shell for ROG Flow Z13. Main skin.
Version=0.1

; ============================================================
;  STYLES
; ============================================================
[sBoxLabel]
FontFace=#FontMain#
FontColor=#AmberMid#
FontSize=#FontSizeCaption#
StringStyle=BOLD
AntiAlias=1
; caption sits on the top border with the screen colour behind it
SolidColor=#ScreenBG#
Padding=6,0,6,1

[sBrand]
FontFace=#FontMain#
FontColor=#AmberBright#
FontSize=#FontSizeBrand#
StringStyle=BOLD
AntiAlias=1

[sModeline]
FontFace=#FontMain#
FontColor=#AmberBright#
FontSize=19
StringStyle=BOLD
AntiAlias=1

[sHdrBtn]
FontFace=#FontMain#
FontColor=#AmberBright#
FontSize=11
StringStyle=BOLD
AntiAlias=1
StringAlign=CENTERCENTER

; ============================================================
;  BEZEL + SCREEN FRAME
; ============================================================
[MeterBezel]
Meter=Shape
Shape=Rectangle 0,0,#ShellW#,#ShellH#,10 | FillColor #BezelBG# | StrokeWidth 1 | Stroke Color 29,26,19,255

[MeterScreen]
Meter=Shape
Shape=Rectangle #BezelRailW#,13,(#ShellW#-#BezelRailW#-15),(#ShellH#-26),4 | FillColor #ScreenBG# | StrokeWidth 0

; ---- LED rail (W12b) : 5 workspace LEDs on the bezel gutter ----
; Active LED driven by #Workspace#. Stubbed as static here; A1 wires the group.
[MeterLED1]
Meter=Shape
Shape=Rectangle 12,300,11,11,2 | FillColor #LEDOn# | StrokeWidth 0
[MeterLED2]
Meter=Shape
Shape=Rectangle 12,332,11,11,2 | FillColor #LEDOff# | StrokeWidth 0
[MeterLED3]
Meter=Shape
Shape=Rectangle 12,364,11,11,2 | FillColor #LEDOff# | StrokeWidth 0
[MeterLED4]
Meter=Shape
Shape=Rectangle 12,396,11,11,2 | FillColor #LEDOff# | StrokeWidth 0
[MeterLED5]
Meter=Shape
Shape=Rectangle 12,428,11,11,2 | FillColor #LEDOff# | StrokeWidth 0

; ============================================================
;  W1 — HEADER  (brand · modeline · FUNCTIONS · ALERTS)
;  Fits within HdrH=42. Watch the (R) superscript.
; ============================================================
[MeterBrand]
Meter=String
MeterStyle=sBrand
X=(#BezelRailW#+16)
Y=52
Text=pipOS

[MeterModeline]
Meter=String
MeterStyle=sModeline
X=175
Y=57
Text=SHELL LOCAL — DEV MODE
; underline
[MeterModelineRule]
Meter=Shape
Shape=Line 175,80,700,80 | Stroke Color #AmberMid# | StrokeWidth 1

[MeterFunctions]
Meter=String
MeterStyle=sHdrBtn
X=980
Y=52
W=150
H=29
Text=FUNCTIONS
SolidColor=0,0,0,1
; box
[MeterFunctionsBox]
Meter=Shape
Shape=Rectangle 980,52,150,29,3 | StrokeWidth 1 | Stroke Color #AmberMid# | FillColor 0,0,0,1
LeftMouseUpAction=[!Log "FUNCTIONS tapped"]

[MeterAlerts]
Meter=String
MeterStyle=sHdrBtn
X=1140
Y=52
W=110
H=29
Text=ALERTS
SolidColor=0,0,0,1
[MeterAlertsBox]
Meter=Shape
Shape=Rectangle 1140,52,110,29,3 | StrokeWidth 1 | Stroke Color #AmberMid# | FillColor 0,0,0,1
LeftMouseUpAction=[!Log "ALERTS tapped"]

; ============================================================
;  RESERVED HOLE for the Notes child skin (A0 proof).
;  The main skin draws the FRAME + caption; the child skin
;  renders only the inner content, positioned from the same
;  geometry vars (Notes*/Editor* in Variables.inc).
;  Notes is now full width of the left column (console removed).
; ============================================================
[MeterNotesFrame]
Meter=Shape
Shape=Rectangle #NotesX#,#NotesY#,#NotesW#,#NotesH#,3 | StrokeWidth 1 | Stroke Color #AmberMid# | FillColor 0,0,0,1
[MeterNotesCap]
Meter=String
MeterStyle=sBoxLabel
X=(#NotesX#+12)
Y=(#NotesY#-7)
Text=NOTES

; ============================================================
;  LIGHT WIDGET SECTIONS (A1)
;  Uncomment as each stub in includes\ is filled in. Keeping
;  them included from the start means positions are validated
;  against the budget early. See tests\check_geometry.py.
; ============================================================
; @Include1=#@#..\Pixel\includes\Session.inc
; @Include2=#@#..\Pixel\includes\Bay.inc
; @Include3=#@#..\Pixel\includes\Banner.inc
; @Include4=#@#..\Pixel\includes\Telemetry.inc
; @Include5=#@#..\Pixel\includes\Transport.inc
; @Include6=#@#..\Pixel\includes\Rail.inc
