; ============================================================
;  Pixel\pipOS.ini — MAIN SKIN (PIXEL / IMAX variant)
;  Holds the bezel, frame, header, LED rail, the Notes reserved
;  hole, and @Includes the six light-widget sections (A1).
;
;  Colours come from the active theme's ROLE tokens (Bg, Fg, Dim,
;  Faint, Frame, Key, Str, Num, Path, Kw, Ok, Warn, Err, InkOnFill),
;  so swapping @IncludeTheme recolours the whole shell. Geometry
;  comes from Variables.inc. No literals (CLAUDE.md #9).
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
Draggable=0
BackgroundMode=2
SolidColor=0,0,0,255
DynamicVariables=1
; DPI: design is 1280x800 logical (2560x1600 @ 200%).

[Variables]
@IncludeVars=#@#Variables.inc
; theme tokens — swap this line to change scheme (§17.5). HC black-bg only.
@IncludeTheme=#@#Themes\hc-amber.inc

; ---- SHARED LOGIC (§17.6) — measures only, also used by TUI ----
@IncludeLogic1=#@#logic\sensors.inc
@IncludeLogic2=#@#logic\workspace.inc
@IncludeLogic3=#@#logic\toggles.inc
@IncludeLogic4=#@#logic\status.inc
@IncludeLogic5=#@#logic\power.inc

[Metadata]
Name=pipOS
Author=pipOS
Information=Amber-phosphor IMAX-console shell for ROG Flow Z13. Main skin (Pixel variant).
Version=0.2

; ============================================================
;  SHARED STYLES  (referenced by includes\*.inc)
; ============================================================
[sCap]
; caption-break label: sits ON the top border, screen colour behind it
FontFace=#FontMain#
FontColor=#Kw#
FontSize=#FontSizeCaption#
StringStyle=BOLD
AntiAlias=1
SolidColor=#Bg#
Padding=6,0,6,1

[sBody]
FontFace=#FontMain#
FontColor=#Fg#
FontSize=#FontSizeBody#
AntiAlias=1
ClipString=1

[sKey]
FontFace=#FontMain#
FontColor=#Key#
FontSize=#FontSizeBody#
StringStyle=BOLD
AntiAlias=1
ClipString=1

[sVal]
FontFace=#FontMain#
FontColor=#Num#
FontSize=#FontSizeReadout#
AntiAlias=1
ClipString=1

[sValBig]
FontFace=#FontMain#
FontColor=#Num#
FontSize=16.5
AntiAlias=1
ClipString=1

[sSub]
FontFace=#FontMain#
FontColor=#Dim#
FontSize=6.75
StringStyle=BOLD
AntiAlias=1

[sInk]
FontFace=#FontMain#
FontColor=#InkOnFill#
FontSize=#FontSizeBody#
StringStyle=BOLD
AntiAlias=1
ClipString=1

[sBtn]
FontFace=#FontMain#
FontColor=#Fg#
FontSize=11.25
StringStyle=BOLD
AntiAlias=1
StringAlign=CENTERCENTER

; ============================================================
;  BEZEL + SCREEN FRAME
; ============================================================
[MeterBezel]
Meter=Shape
Shape=Rectangle 0,0,#ShellW#,#ShellH#,10 | FillColor #Bezel# | StrokeWidth 1 | Stroke Color #Faint#

[MeterScreen]
Meter=Shape
Shape=Rectangle #BezelRailW#,13,(#ShellW#-#BezelRailW#-15),(#ShellH#-26),4 | FillColor #Bg# | StrokeWidth 0

; ---- LED rail (W12b): 5 workspace LEDs on the bezel gutter (green only here) ----
; Active LED driven by #Workspace#; A1 shows WS1 lit, B wires the group to the measure.
[MeterLED1]
Meter=Shape
Shape=Rectangle 12,304,11,11,2 | FillColor #Ok# | StrokeWidth 0
[MeterLED2]
Meter=Shape
Shape=Rectangle 12,331,11,11,2 | FillColor #Faint# | StrokeWidth 0
[MeterLED3]
Meter=Shape
Shape=Rectangle 12,358,11,11,2 | FillColor #Faint# | StrokeWidth 0
[MeterLED4]
Meter=Shape
Shape=Rectangle 12,385,11,11,2 | FillColor #Faint# | StrokeWidth 0
[MeterLED5]
Meter=Shape
Shape=Rectangle 12,412,11,11,2 | FillColor #Faint# | StrokeWidth 0

; ============================================================
;  W1 — HEADER  (brand · modeline · FUNCTIONS · ALERTS)
;  v21 geometry. Fits within HdrH=42.
; ============================================================
[MeterBrand]
Meter=String
FontFace=#FontMain#
FontColor=#Fg#
FontSize=#FontSizeBrand#
StringStyle=BOLD
AntiAlias=1
X=50
Y=38
Text=pipOS

[MeterBrandReg]
Meter=String
FontFace=#FontMain#
FontColor=#Dim#
FontSize=7.5
AntiAlias=1
X=127
Y=36
Text=®

[MeterModeline]
Meter=String
FontFace=#FontMain#
FontColor=#Fg#
FontSize=14.25
StringStyle=BOLD
AntiAlias=1
X=139
Y=43
Text=SHELL LOCAL — DEV MODE

[MeterModelineRule]
Meter=Shape
Shape=Line 139,70,1030,70 | Stroke Color #Frame# | StrokeWidth 1

[MeterFunctionsBox]
Meter=Shape
Shape=Rectangle 1053,39,104,29,3 | StrokeWidth 1 | Stroke Color #Frame# | FillColor 0,0,0,1
LeftMouseUpAction=[!Log "FUNCTIONS tapped"]
[MeterFunctions]
Meter=String
MeterStyle=sBtn
FontSize=8.25
X=1105
Y=53
Text=FUNCTIONS

[MeterAlertsBox]
Meter=Shape
Shape=Rectangle 1169,39,80,29,3 | StrokeWidth 1 | Stroke Color #Frame# | FillColor 0,0,0,1
LeftMouseUpAction=[!Log "ALERTS tapped"]
[MeterAlerts]
Meter=String
MeterStyle=sBtn
FontSize=8.25
X=1209
Y=53
Text=ALERTS

; ============================================================
;  RESERVED HOLE — Notes child skin (W17, full-width top pane).
;  Main draws the frame + caption; Notes.ini renders the inner
;  content, positioned from Notes* in Variables.inc.
; ============================================================
[MeterNotesFrame]
Meter=Shape
Shape=Rectangle #NotesX#,#NotesY#,#NotesW#,#NotesH#,3 | StrokeWidth 1 | Stroke Color #Frame# | FillColor 0,0,0,1
[MeterNotesCap]
Meter=String
MeterStyle=sCap
X=(#NotesX#+12)
Y=(#NotesY#-7)
Text=NOTES

; ============================================================
;  LIGHT WIDGET SECTIONS (A1) — wired.
; ============================================================
@Include1=#@#..\Pixel\includes\Session.inc
@Include2=#@#..\Pixel\includes\Bay.inc
@Include3=#@#..\Pixel\includes\Banner.inc
@Include4=#@#..\Pixel\includes\Telemetry.inc
@Include5=#@#..\Pixel\includes\Transport.inc
@Include6=#@#..\Pixel\includes\Rail.inc
