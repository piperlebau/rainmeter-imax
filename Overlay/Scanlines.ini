; ============================================================
;  Scanlines.ini — always-on-top, ClickThrough overlay.
;  Tiles a 4px scanline PNG over the whole shell. Baked alpha;
;  Rainmeter has no blend modes (dead-end 9). ClickThrough=1 so
;  it never eats taps. Provide @Resources\Images\scanline.png.
; ============================================================
[Rainmeter]
Update=-1
AccurateText=1
Draggable=0
ClickThrough=1
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@IncludeVars=#@#Variables.inc

[MeterScan]
Meter=Image
X=0
Y=0
W=#ShellW#
H=#ShellH#
ImageName=#@#Images\scanline.png
Tile=1
; TODO: add @Resources\Images\scanline.png (4px tall, alpha-baked)
