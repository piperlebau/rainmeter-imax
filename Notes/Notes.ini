; ============================================================
;  Notes.ini — CHILD SKIN (W17)
;  Inner notes content only; lands inside the NOTES frame from
;  pipOS.ini at Notes* coords. Per-workspace file:
;    @Resources\Workspaces\notes\ws<N>-<code>.md
;  A0: placeholder line. C: Quote read + InputTextX edit (§10).
;
;  Positioning: the skin MOVES ITSELF into the reserved hole on
;  refresh (Notes*/DpiScale from Variables.inc). This assumes the
;  main Pixel skin sits at screen 0,0. !Move works in physical
;  screen px, hence the DpiScale factor.
; ============================================================
[Rainmeter]
Update=1000
AccurateText=1
Draggable=0
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!Move "((#NotesX#+1)*#DpiScale#)" "((#NotesY#+1)*#DpiScale#)"]

[Variables]
@IncludeVars=#@#Variables.inc
; same theme line as the main skins — keep all three in sync (§17.5)
@IncludeTheme=#@#Themes\hc-amber.inc

[sBody]
FontFace=#FontMain#
FontColor=#Fg#
FontSize=#FontSizeBody#
AntiAlias=1
ClipString=1

[MeterPlaceholder]
Meter=String
MeterStyle=sBody
X=12
Y=10
W=(#NotesW#-24)
H=#EdLineH#
Text=notes child skin aligned in hole
